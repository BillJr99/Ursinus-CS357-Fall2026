name: Publish Agent YOLO Container

# Builds the hardened "yolo mode" agent container and publishes it to GHCR.
#
# Triggers are deliberately narrow so this NEVER runs on ordinary content
# commits or on feature branches:
#   - manual dispatch, or
#   - a pushed tag of the form  agent-container-v*  (e.g. agent-container-v1)
#   - a push to gh-pages that actually changes the container files
on:
  workflow_dispatch:
  push:
    tags:
      - "agent-container-v*"
    branches:
      - gh-pages
    paths:
      - "files/agent-yolo-container/**"
      - ".github/workflows/publish-agent-container.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/agent-yolo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (no submodules needed for the image)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: files/agent-yolo-container
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
