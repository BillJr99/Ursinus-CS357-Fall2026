plugins:
  - jekyll-relative-links
#  - jekyll-target-blank

relative_links:
  enabled: true
  collections: true

theme: jekyll-theme-slate

title: "CS357"
description: "Foundations of Artificial Intelligence"

url                      : https://BillJr99.github.io # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "/Ursinus-CS357-Fall2026" # the subpath of your site, e.g. "/blog"

# Reading Files
include:
  - .htaccess
  - _pages
  - files

# Where LiaScript activity decks are fetched from.
#
# Change this one line to render them from somewhere else.
#
# Usable only in page BODIES ({{ site.activity_url }}liascript-agentloop.md).
# Jekyll does not evaluate Liquid inside front matter, and the deck files
# themselves are not Jekyll-processed at all -- LiaScript fetches them straight
# from GitHub raw -- so links in those two places name the PARENT repository on
# purpose: hardcoding a semester in a link is what this variable exists to
# avoid, and the parent is the semester-free target.
#
# This line and baseurl above are the only places a semester may appear.
activity_url             : "https://www.billmongan.com/LiaScript/?https://raw.githubusercontent.com/BillJr99/Ursinus-CS357-Fall2026/gh-pages/_pages/Activities/"
